name: Build pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches:
  release:
    types: [ "created" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-java:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: build
        run: |
          ./gradlew :packages:java:build

  build-kotlin:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: build
        run: |
          ./gradlew :packages:kotlin:build

  build-python:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.2
          architecture: x64
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: generate
        run: |
          ./gradlew :packages:python:wirespec
      - name: install
        working-directory: packages/python
        run: |
          pip install -r requirements.txt
          pip install mypy
      - name: mypy
        working-directory: packages/python
        run: |
          mypy .
      - name: test
        working-directory: packages/python/src
        run: |
          python -m unittest ./sdk_test.py
          python -m unittest ./signing_test.py
          python -m unittest ./signing_key_validation_test.py
          python -m unittest ./user_agent_test.py
          python -m unittest ./send_test.py
          python -m unittest ./transportation_refresh_test.py
          python -m unittest ./session_refresh_test.py
          python -m unittest ./error_response_test.py
          python -m unittest ./secret_masking_test.py
          python -m unittest ./response_signature_test.py
          python -m unittest ./pagination_test.py

  build-npm:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: generate
        run: |
          ./gradlew :packages:npm:wirespec
      - name: install
        working-directory: packages/npm
        run: |
          npm install
      - name: compile
        working-directory: packages/npm
        run: |
          npm run compile
      - name: test
        working-directory: packages/npm
        run: |
          npm test

  build-php:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The PHP emitter is not in a Wirespec release yet: build the compiler from source (see docs/php.md).
      # The ref is the branch of flock-community/wirespec#763; switch it to master once that is merged.
      - name: Checkout Wirespec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flock-community/wirespec
          ref: ccr-cd2812be-wpuamx
          path: build/wirespec
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, json, openssl
          tools: composer
          coverage: none
      - name: publish wirespec
        working-directory: build/wirespec
        run: |
          ./gradlew \
            :src:compiler:core:publishJvmPublicationToMavenLocal :src:compiler:core:publishKotlinMultiplatformPublicationToMavenLocal \
            :src:compiler:emitters:php:publishJvmPublicationToMavenLocal :src:compiler:emitters:php:publishKotlinMultiplatformPublicationToMavenLocal \
            :src:converter:common:publishJvmPublicationToMavenLocal :src:converter:common:publishKotlinMultiplatformPublicationToMavenLocal \
            :src:converter:openapi:publishJvmPublicationToMavenLocal :src:converter:openapi:publishKotlinMultiplatformPublicationToMavenLocal
      - name: generate
        run: |
          ./gradlew :packages:php:wirespec
      - name: install
        working-directory: packages/php
        run: |
          composer install --no-interaction --no-progress
      - name: lint
        working-directory: packages/php
        run: |
          find src tests gen -name '*.php' -print0 | xargs -0 -n 200 -P 4 php -l > /dev/null
      - name: test
        working-directory: packages/php
        run: |
          vendor/bin/phpunit
