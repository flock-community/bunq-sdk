name: Build pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches:
  release:
    types: [ "created" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-java:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: build
        run: |
          ./gradlew :packages:java:build

  build-kotlin:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: build
        run: |
          ./gradlew :packages:kotlin:build

  build-python:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.2
          architecture: x64
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: generate
        run: |
          ./gradlew :packages:python:wirespec
      - name: install
        working-directory: packages/python
        run: |
          pip install -r requirements.txt
          pip install mypy
      - name: mypy
        working-directory: packages/python
        run: |
          mypy .
      - name: test
        working-directory: packages/python/src
        run: |
          python -m unittest ./sdk_test.py
          python -m unittest ./signing_test.py
          python -m unittest ./signing_key_validation_test.py
          python -m unittest ./user_agent_test.py
          python -m unittest ./send_test.py
          python -m unittest ./transportation_refresh_test.py
          python -m unittest ./session_refresh_test.py
          python -m unittest ./error_response_test.py
          python -m unittest ./secret_masking_test.py
          python -m unittest ./response_signature_test.py
          python -m unittest ./pagination_test.py

  build-npm:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: generate
        run: |
          ./gradlew :packages:npm:wirespec
      - name: install
        working-directory: packages/npm
        run: |
          npm install
      - name: compile
        working-directory: packages/npm
        run: |
          npm run compile
      - name: test
        working-directory: packages/npm
        run: |
          npm test
